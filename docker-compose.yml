services:
  postgres:
    image: postgres:16-alpine
    container_name: digishelf-postgres
    environment:
      - POSTGRES_DB=digishelf
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digishelf"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digishelf-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - DB_ENGINE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=digishelf
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8009:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digishelf-frontend
    environment:
      - VITE_API_ENDPOINT=http://127.0.0.1:8009
      - VITE_DEV_BACKEND_ORIGIN=http://127.0.0.1:8009
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5179"
    restart: unless-stopped

volumes:
  postgres_data:
