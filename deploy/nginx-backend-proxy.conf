# Snippet for nginx when proxying /sitemap.xml, /robots.txt, and /api/ to Django.
# Without X-Forwarded-Proto and a public Host, Django SECURE_SSL_REDIRECT (if enabled)
# redirects browsers to https://backend/sitemap.xml.
#
# Example:
#   location /sitemap.xml {
#       include /path/to/digishelf/deploy/nginx-backend-proxy.conf;
#       proxy_pass http://127.0.0.1:8009;
#   }

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
